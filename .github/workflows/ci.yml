name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://tcg:tcg@localhost:5432/tcg
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: tcg
          POSTGRES_USER: tcg
          POSTGRES_PASSWORD: tcg
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tcg -d tcg"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prisma:validate
      - run: npm run prisma:generate
      - run: npm run prisma:migrate:deploy
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
