services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: tcg
      POSTGRES_USER: tcg
      POSTGRES_PASSWORD: tcg
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tcg -d tcg"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  scanner:
    build:
      context: ./services/ai
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
    environment:
      TCGDEX_API_URL: https://api.tcgdex.net/v2/en
      SCANNER_URL: http://scanner:8001
      DATABASE_URL: postgresql://tcg:tcg@postgres:5432/tcg
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      DEAL_ALERT_TELEGRAM_CHAT_IDS: ${DEAL_ALERT_TELEGRAM_CHAT_IDS:-}
      DEAL_ALERT_DISCORD_WEBHOOK_URL: ${DEAL_ALERT_DISCORD_WEBHOOK_URL:-}
      DEAL_RADAR_INTERNAL_TOKEN: ${DEAL_RADAR_INTERNAL_TOKEN:-}
      DEAL_ALERT_MIN_SCORE: ${DEAL_ALERT_MIN_SCORE:-70}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      scanner:
        condition: service_healthy

  deal-radar:
    build:
      context: ./services/deal-radar
    environment:
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_DEAL_CHANNEL_IDS: ${DISCORD_DEAL_CHANNEL_IDS:-}
      DEAL_RADAR_INTERNAL_TOKEN: ${DEAL_RADAR_INTERNAL_TOKEN:-}
      DEAL_RADAR_DISCORD_INGEST_URL: http://web:3000/api/deal-radar/discord
    depends_on:
      - web
    profiles: ["deal-radar"]

volumes:
  postgres_data:
